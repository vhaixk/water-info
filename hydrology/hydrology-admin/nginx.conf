events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # 数据导入需要大请求体
    client_max_body_size 100m;

    server {
        listen       80;
        server_name  localhost;

         # 根路径跳转到前端生产路径（vite 生产 base /water-info/web/）
         location = / {
             return 302 /water-info/web/;
         }

         location /water-info/web/ {
             alias   /usr/share/nginx/html/;
             index  index.html index.htm;
             try_files $uri $uri/ /water-info/web/index.html;
         }

         location /water-info/prod/ {
             rewrite ^/water-info/prod/(.*)$ /$1 break;

             proxy_pass http://water-info:18890;

             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
         }
    }
}