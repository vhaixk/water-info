events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # 容器内监听 80、宿主机映射端口不同，绝对重定向会丢端口，改用相对 Location
    absolute_redirect off;
    client_max_body_size 500m;

    server {
        listen       80;
        server_name  localhost;

         # 根路径跳转到前端入口（vue-router base 为 /water-info/，资源 base /water-info/web/ 仅用于静态文件）
         location = / {
             return 302 /water-info/;
         }

         location /water-info/web/ {
             alias   /usr/share/nginx/html/;
             index  index.html index.htm;
             try_files $uri $uri/ /water-info/web/index.html;
         }

         # SPA 路由刷新回退（router base /water-info/）：非静态/接口路径返回 index.html
         location /water-info {
             alias   /usr/share/nginx/html/;
             index  index.html index.htm;
             try_files $uri $uri/ /water-info/web/index.html;
         }

         location /water-info/prod/ {
             rewrite ^/water-info/prod/(.*)$ /$1 break;

             proxy_pass http://water-info:18890;

             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
         }
    }
}